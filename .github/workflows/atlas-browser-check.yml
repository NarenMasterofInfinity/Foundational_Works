name: Atlas browser smoke check
on:
  push:
    branches: [main]
    paths:
      - "system-design/**"
      - ".github/workflows/atlas-browser-check.yml"
  pull_request:
    paths:
      - 'system-design/**'
      - '.github/workflows/atlas-browser-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax and complete HTML build
        run: |
          python3 -m compileall -q system-design/src
          python3 system-design/src/build.py
          python3 system-design/src/verify_example.py
          python3 system-design/src/verify_mechanisms.py
      - name: Start headless Chrome
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --no-default-browser-check --remote-debugging-port=0 --user-data-dir=/tmp/atlas-browser-profile about:blank >/tmp/atlas-chrome.log 2>&1 &
          for i in $(seq 1 50); do
            [ -f /tmp/atlas-browser-profile/DevToolsActivePort ] && exit 0
            sleep 1
          done
          cat /tmp/atlas-chrome.log
          exit 1
      - name: Verify actual desktop/mobile rendered edition
        run: node system-design/src/verify_complete.mjs "$GITHUB_WORKSPACE" /tmp/atlas-browser-profile/DevToolsActivePort
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-browser-qa
          path: |
            /tmp/system-design-complete-qa
            /tmp/atlas-chrome.log
          if-no-files-found: ignore
