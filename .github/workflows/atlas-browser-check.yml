name: Atlas release check
on:
  push:
    branches: [main]
    paths:
      - "system-design/**"
      - ".github/workflows/atlas-browser-check.yml"
  pull_request:
    paths:
      - 'system-design/**'
      - '.github/workflows/atlas-browser-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The repository permits local actions only. Public, read-only checkout
      # needs no token and runs without third-party actions.
      - name: Check out the exact event commit
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --version
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Python syntax and complete HTML build
        run: |
          python3 -m compileall -q system-design/src
          python3 system-design/src/build.py
          git diff --exit-code -- system-design/index.html system-design/BLUEPRINT.md system-design/completion-manifest.json
          python3 system-design/src/verify_release.py
          python3 system-design/src/verify_example.py
          python3 system-design/src/verify_mechanisms.py
      - name: Start headless Chrome
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --no-default-browser-check --remote-debugging-port=0 --user-data-dir=/tmp/atlas-browser-profile about:blank >/tmp/atlas-chrome.log 2>&1 &
          for i in $(seq 1 50); do
            [ -f /tmp/atlas-browser-profile/DevToolsActivePort ] && exit 0
            sleep 1
          done
          cat /tmp/atlas-chrome.log
          exit 1
      - name: Verify actual desktop/mobile rendered edition
        run: node system-design/src/verify_complete.mjs "$GITHUB_WORKSPACE" /tmp/atlas-browser-profile/DevToolsActivePort
      - name: Show browser diagnostics
        if: always()
        run: |
          cat /tmp/atlas-chrome.log 2>/dev/null || true
          cat /tmp/system-design-complete-qa/unit4-quality.json 2>/dev/null || true
