name: Actions Runner Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/actions-runner-probe.yml']
  pull_request:
    paths: ['.github/workflows/actions-runner-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner starts
        run: echo "GitHub Actions runner started successfully"
